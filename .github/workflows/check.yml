name: Check Burnhop
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:node
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:server
